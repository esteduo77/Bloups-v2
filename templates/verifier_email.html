<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vérification — BLOOPS</title>
</head>
<body>
    <main>
        <h1>Vérifier mon adresse e-mail</h1>
        <p>Confirme que tu souhaites vérifier cette adresse e-mail.</p>

        <form method="POST">
            <input type="hidden" name="csrf_token"
                   value="{{ csrf_token() }}">
            <button type="submit">Confirmer mon adresse</button>
        </form>
    </main>
</body>
</html>
