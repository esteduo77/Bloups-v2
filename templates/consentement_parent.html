<!DOCTYPE html>

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validation du représentant légal — BLOOPS</title>
</head>
<body>

        <h1>Validation de la demande BLOOPS</h1>

        </form>
